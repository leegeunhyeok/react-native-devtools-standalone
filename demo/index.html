<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>react-native-devtools-standalone</title>
    <style>
      html {
        height: 100%;
        font-family: sans-serif;
      }

      body {
        height: 100%;
        margin: 0;
        padding: 0;
        background-color: #fff;
        color: #777d88;
      }

      .full {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        overflow: auto;
      }

      #loading {
        position: fixed;
        width: 100%;
        background-color: white;
        z-index: 9999;
      }
    </style>
  </head>
  <body>
    <div id="loading" class="full">
      <p>Waiting for connection</p>
    </div>
    <div
      id="container"
      class="full"
      style="-webkit-user-select: none; -webkit-app-region: drag"
    >
      <!-- DevTools -->
    </div>
    <script src="/dist/index.js"></script>
  </body>
</html>
